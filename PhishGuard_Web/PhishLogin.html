<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="PhishGuard AI Login Interface - Detect phishing URLs, analyze QR codes and inspect domain security using intelligent security analysis.">
    <title>PhishGuard Login</title>
    <link rel="website icon" href="images/PhishGuard AI logo.png" type="image/png">
    <link rel="stylesheet" href="css/PhishLogin.css">
    <script type="module" src="js/PhishLogin.js"></script>
</head>
<body data-dashboard-url="Dashboard.html">
    <main class="login-container">
        <div class="login-card">
            <img src="images/PhishGuard AI logo.png" alt="PhishGuard AI Logo" class="login-logo"/>
            <h1>Welcome to PhishGuard AI</h1>
            <p class="login-subtitle">
                Detect. Analyze. Stay Secure.
            </p>
            <p class="login-description">
                Sign in with your Google account to access PhishGuard AI security features.
            </p>
            <button type="button" id="googleSignInBtn">
                <img src="images/google-icon.png" alt="Google-Icon" class="google-icon"/>
                Continue with Google
            </button>
            <p id="loginStatus" role="status" aria-live="polite"></p>
            <p class="login-footer">
                Your account is securely authenticated using Google.
            </p>
        </div>
    </main>
</body>
</html>
